plugins {
    id 'com.android.application'
}

android {
    namespace 'id.reverser.unpin'
    compileSdk 34

    defaultConfig {
        applicationId 'id.reverser.unpin'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files('libs/xposed-api-stub.jar')
}
