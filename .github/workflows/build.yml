name: build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          chmod +x gradlew
          CMDLINE=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/ | head -1)
          yes | "${CMDLINE}bin/sdkmanager" --licenses > /dev/null || true
          "${CMDLINE}bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;36.0.0"
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopee-unpin-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shopee-unpin-apk
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
